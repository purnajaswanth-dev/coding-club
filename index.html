<!doctype html>
<html lang="en">
  <head>

    <meta name="description" content="Coding Club at SRM University AP. Workshops, hackathons, contests and real projects — built by students." />
    <meta property="og:title" content="Coding Club — SRM University AP" />

    <meta name="theme-color" content="#070707" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <div id="root">
      <noscript>
        <div style="font-family: system-ui, sans-serif; background: #070707; color: #fff; padding: 40px; text-align: center; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
          <h1 style="color: #e5202e; font-size: 28px; margin-bottom: 12px;">JavaScript Required</h1>
          <p style="color: #a0a0a0; max-width: 500px; line-height: 1.5;">Please enable JavaScript or run this application using a local web server (<code>npm run dev</code>) to view the Coding Club website.</p>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Helpful alert if user opens index.html directly from file system instead of web server
      if (window.location.protocol === 'file:') {
        console.warn('Vite apps cannot run via file:// protocol directly. Please run `npm run dev` in your terminal and visit http://localhost:5173');
      }
    </script>
